name: remake-ci

on:
  push:
    paths:
      - 'remake/**'
      - '.github/workflows/remake-ci.yml'
  pull_request:
    paths:
      - 'remake/**'
      - '.github/workflows/remake-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remake
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # The wrapper is checked out without the executable bit, so it runs through sh.
      # Testcontainers needs Docker, which is available on the hosted runner.
      - name: Verify
        run: sh ./mvnw -B verify
